<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OilAndCharge - 차량 관리</title>
    <!-- 공통 CSS 및 차량 관리 전용 CSS 연결 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/car.css') }}">
</head>
<body>

    <!-- 메인 컨텐츠 레이아웃 -->
    <main>
        
        <!-- 왼쪽: 패널 영역 -->
        <aside>
            
            <!-- 패널 상단: 로고(좌측) 및 메뉴(중앙 정렬, '차량 관리'에 활성화 클래스 적용) -->
            <div class="left-header-area">
                <div class="logo">
                    OilAndCharge
                </div>
                <nav>
                    <a href="/" class="nav-link">주유소 찾기</a>
                    <a href="/car" class="nav-link-active">차량 관리</a>
                </nav>
            </div>

            <!-- 차량 관리 섹션 -->
            <div class="search-section">
                <h2 class="section-title">차량 관리</h2>
                
                <!-- 차량 등록 버튼 -->
                <button type="button" id="openModalBtn" class="btn-car-register">차량 등록</button>

                

                <!-- 등록된 차량 리스트 영역 (스크롤 적용) -->
                <div 
                class="station-list"
                id="vehicle-list"
                >
                    <p>
                        차량 정보를 불러오는 중...
                    </p>
                </div>
            </div>

        </aside>

        <!-- 오른쪽: 카카오맵 영역 -->
        <div id="map-area"
            style="
                position:relative;
                flex:1;
                height:100vh;
            ">

            <!-- 현재 위치 좌표 표시 -->
            <div id="location-info"
                style="
                    position:absolute;
                    top:20px;
                    right:20px;
                    z-index:10;
                    background:white;
                    padding:12px 16px;
                    border-radius:8px;
                    box-shadow:0 2px 8px rgba(0,0,0,0.2);
                    font-size:14px;
                ">
                현재 위치를 확인하는 중...
            </div>

            <!-- 실제 카카오맵 -->
            <div id="map"
                style="
                    width:100%;
                    height:100%;
                ">
            </div>

        </div>

    </main>

    <div id="carModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">차량 등록하기</h3>
                <button type="button" id="closeModalBtn" class="modal-close-btn">&times;</button>
            </div>

            <form
                id="carRegisterForm"
                class="modal-form"
            >
                
                <div class="input-group">
                    <label>차량명</label>
                    <input
                        type="text"
                        name="vehicle_name"
                        maxlength="255"
                        placeholder="예: 아반떼"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>소유주</label>
                    <input type="text" name="owner" maxlength="255" placeholder="예: 김코딩" required>
                </div>

                <div class="input-group">
                    <label>연비</label>
                    <input
                        type="number"
                        step="0.1"
                        min="0.1"
                        name="fuel_efficiency"
                        placeholder="예: 12.5"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>기름 종류</label>
                    <select name="fuel_type" required>
                        <option value="" disabled selected>기름 종류 선택</option>
                        <option value="휘발유">휘발유</option>
                    </select>
                </div>

                <div class="modal-footer">
                    <button type="button" id="cancelModalBtn" class="btn-cancel">취소</button>
                    <button type="submit" class="btn-submit">등록하기</button>
                </div>

            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/car.js') }}"></script>

    <script
        type="text/javascript"
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey={{ config.KAKAO_JAVASCRIPT_KEY }}">
    </script>
    <script>
        // =============================
        // 카카오맵 생성
        // =============================

        const mapContainer =
            document.getElementById('map');

        const mapOption = {
            // 위치 확인 전 기본 위치
            center: new kakao.maps.LatLng(
                37.566826,
                126.978656
            ),
            level: 3
        };

        const map =
            new kakao.maps.Map(
                mapContainer,
                mapOption
            );


        // =============================
        // 현재 위치 가져오기
        // =============================

        if (navigator.geolocation) {

            navigator.geolocation.getCurrentPosition(

                // 위치 조회 성공
                function(position) {

                    const lat =
                        position.coords.latitude;

                    const lon =
                        position.coords.longitude;

                    console.log(
                        '현재 위도:',
                        lat
                    );

                    console.log(
                        '현재 경도:',
                        lon
                    );


                    // 화면에 현재 위치 좌표 표시
                    document.getElementById(
                        'location-info'
                    ).innerHTML =
                        '<strong>현재 위치</strong><br>' +
                        '위도: ' +
                        lat.toFixed(6) +
                        '<br>' +
                        '경도: ' +
                        lon.toFixed(6);


                    // 현재 위치를 Kakao LatLng 객체로 변환
                    const currentPosition =
                        new kakao.maps.LatLng(
                            lat,
                            lon
                        );


                    // 지도 중심을 현재 위치로 이동
                    map.setCenter(
                        currentPosition
                    );


                    // 현재 위치 마커 생성
                    const currentMarker =
                        new kakao.maps.Marker({
                            position:
                                currentPosition
                        });


                    // 지도에 현재 위치 마커 표시
                    currentMarker.setMap(
                        map
                    );
                },


                // 위치 조회 실패
                function(error) {

                    console.error(
                        '현재 위치 조회 실패:',
                        error
                    );

                    document.getElementById(
                        'location-info'
                    ).innerHTML =
                        '<strong>위치 확인 실패</strong><br>' +
                        '브라우저 위치 권한을 확인해주세요.';
                }
            );

        } else {

            document.getElementById(
                'location-info'
            ).innerHTML =
                '현재 위치 기능을 지원하지 않는 브라우저입니다.';
        }
    </script>
</body>
</html>
