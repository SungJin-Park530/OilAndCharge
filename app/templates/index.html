<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OilAndCharge - 주유소 찾기</title>
    <!-- index.css 파일 연결 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>

    <!-- 메인 컨텐츠 레이아웃 -->
    <main>
        
        <!-- 왼쪽: 차량 관리 및 최적가 주유소 탐색 패널 -->
        <aside>
            
            <!-- 패널 상단: 로고(좌측) 및 메뉴(우측) -->
            <div class="left-header-area">
                <div class="logo">
                    OilAndCharge
                </div>
                <nav>
                    <a href="/" class="nav-link-active">주유소 찾기</a>
                    <a href="/car" class="nav-link">차량 관리</a>
                </nav>
            </div>

            <!-- 최적가 주유소 탐색 섹션 -->
            <div class="search-section">
                <h2 class="section-title">
                    최적가 주유소 검색하기
                </h2>
                
                <!-- 검색 옵션 -->
                <div class="search-options">
                    <div class="input-group">
                        <label>대상 차량</label>
                        <select>
                            <option>레이 (휘발유)</option>
                        </select>
                    </div>
                </div>

                <!-- 주유소 리스트 카드 영역 -->
                <div class="station-list">
                    
                    <!-- 카드 1 (최적추천) -->
                    <div class="station-card optimal">
                        <div class="station-header">
                            <div class="station-title-area">
                                <span class="station-name">GS칼텍스 강남점</span>
                                <span class="badge-optimal">최적추천</span>
                            </div>
                            <span class="distance">1.2km</span>
                        </div>
                        <div class="price-text">단가 <strong style="color: #111827;">1,648원/L</strong></div>
                        <div class="price-footer">
                            <span class="cost-desc">실질 소요 비용<br>왕복 이동비 + 주유비</span>
                            <span class="total-cost highlight">₩18,480</span>
                        </div>
                    </div>

                    <!-- 카드 2 -->
                    <div class="station-card">
                        <div class="station-header">
                            <span class="station-name">SK에너지 서초점</span>
                            <span class="distance">2.4km</span>
                        </div>
                        <div class="price-text">단가 <strong style="color: #111827;">1,672원/L</strong></div>
                        <div class="price-footer">
                            <span class="cost-desc">실질 소요 비용<br>왕복 이동비 + 주유비</span>
                            <span class="total-cost">₩19,120</span>
                        </div>
                    </div>

                    <!-- 카드 3 -->
                    <div class="station-card">
                        <div class="station-header">
                            <span class="station-name">S-OIL 역삼점</span>
                            <span class="distance">3.1km</span>
                        </div>
                        <div class="price-text">단가 <strong style="color: #111827;">1,695원/L</strong></div>
                        <div class="price-footer">
                            <span class="cost-desc">실질 소요 비용<br>왕복 이동비 + 주유비</span>
                            <span class="total-cost">₩19,750</span>
                        </div>
                    </div>

                </div>
            </div>

        </aside>

        <!-- 오른쪽: 카카오맵 영역 -->
        <div id="map">
            <div class="map-placeholder">
                카카오맵 API 연동 영역 (준비중)
            </div>
        </div>

    </main>

</body>
</html>
