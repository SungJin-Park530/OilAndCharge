openapi: 3.0.3
info:
  title: OilAndCharge API
  description: >
    사용자 위치 주변 주유소 검색, 실질 비용 계산 및 차량 관리 API 문서.
  version: "1.0.0"
servers:
  - url: /
    description: Default server

tags:
  - name: Pages
    description: 서버에서 렌더링하는 HTML 페이지
  - name: Fuel
    description: 주유소 검색 및 비용 계산 API
  - name: Vehicle
    description: 차량 등록 및 조회 API
  - name: System
    description: 서버 상태 확인

paths:
  /:
    get:
      tags: [Pages]
      summary: 메인 페이지
      description: 메인 화면(index.html)을 렌더링함.
      responses:
        "200":
          description: 메인 페이지 HTML
          content:
            text/html:
              schema:
                type: string

  /history:
    get:
      tags: [Pages]
      summary: 계산 이력 페이지
      description: 계산 이력 목록 화면(history.html)을 렌더링함. 현재는 항상 빈 목록을 전달함.
      responses:
        "200":
          description: 계산 이력 페이지 HTML
          content:
            text/html:
              schema:
                type: string

  /car:
    get:
      tags: [Pages]
      summary: 차량 목록 페이지
      description: DB에 저장된 차량 정보를 카드 형태로 보여주는 화면(car.html)을 렌더링함.
      responses:
        "200":
          description: 차량 목록 페이지 HTML
          content:
            text/html:
              schema:
                type: string

  /health:
    get:
      tags: [System]
      summary: 서버 상태 확인
      description: Flask 서버가 정상적으로 실행되고 있는지 확인함.
      responses:
        "200":
          description: 서버 정상 동작
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: OilAndCharge server is running

  /calculate:
    post:
      tags: [Fuel]
      summary: 단순 주유 비용 계산 (폼 기반)
      description: >
        HTML form으로 전달된 연비, 주유량, 편도거리, 유가를 이용하여
        이동비와 총비용을 계산하고 결과 페이지(result.html)를 렌더링함.
        편도거리의 2배를 왕복거리로 사용함.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                efficiency:
                  type: number
                  format: float
                  description: 차량 연비(km/L)
                  example: 12.5
                amount:
                  type: number
                  format: float
                  description: 주유량(L)
                  example: 30
                distance:
                  type: number
                  format: float
                  description: 편도 거리(km)
                  example: 10
                price:
                  type: number
                  format: float
                  description: 리터당 유가(원/L)
                  example: 1650
              required:
                - efficiency
                - amount
                - distance
                - price
      responses:
        "200":
          description: 계산 결과 페이지 HTML
          content:
            text/html:
              schema:
                type: string
        "400":
          description: 숫자 변환 실패 또는 유효하지 않은 입력값
          content:
            text/plain:
              schema:
                type: string
                example: 차량 연비는 0보다 커야 합니다.

  /api/stations:
    get:
      tags: [Fuel]
      summary: 주변 주유소 검색 및 실질 비용 계산
      description: >
        사용자 위치 주변의 주유소를 OPINET/Kakao Mobility API를 통해 검색하고,
        선택한 차량의 연비와 주유량을 반영한 실질 비용을 계산하여 반환함.
      parameters:
        - name: vehicle_id
          in: query
          required: true
          description: 사용자가 선택한 차량 ID
          schema:
            type: integer
          example: 1
        - name: amount
          in: query
          required: true
          description: 주유량(L)
          schema:
            type: number
            format: float
          example: 30
        - name: lat
          in: query
          required: true
          description: 사용자 현재 위치 위도(WGS84)
          schema:
            type: number
            format: float
          example: 37.566826
        - name: lon
          in: query
          required: true
          description: 사용자 현재 위치 경도(WGS84)
          schema:
            type: number
            format: float
          example: 126.9786567
      responses:
        "200":
          description: 주유소 검색 및 비용 계산 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationSearchResult"
        "400":
          description: 필수 파라미터 누락 또는 잘못된 요청값
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_vehicle_id:
                  value:
                    error: vehicle_id가 필요합니다.
        "502":
          description: OPINET 또는 Kakao Mobility 외부 API 호출 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 예상하지 못한 서버 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/vehicles:
    get:
      tags: [Vehicle]
      summary: 차량 목록 조회
      description: 등록된 휘발유 차량 목록을 조회함. owner를 지정하면 해당 소유주의 차량만 조회함.
      parameters:
        - name: owner
          in: query
          required: false
          description: 특정 소유주의 차량만 조회하고 싶을 경우 사용함.
          schema:
            type: string
          example: test_user
      responses:
        "200":
          description: 차량 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 2
                  vehicles:
                    type: array
                    items:
                      $ref: "#/components/schemas/Vehicle"
        "500":
          description: 차량 목록 조회 중 오류 발생
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [Vehicle]
      summary: 차량 등록
      description: 새로운 차량을 등록함. 현재 MVP는 휘발유 차량만 지원함.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleCreateRequest"
            examples:
              default:
                value:
                  owner: test_user
                  vehicle_name: 아반떼
                  fuel_efficiency: 12.5
                  fuel_type: 휘발유
      responses:
        "201":
          description: 차량 등록 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 차량이 등록되었습니다.
                  vehicle:
                    $ref: "#/components/schemas/Vehicle"
        "400":
          description: 잘못된 요청값 (필수값 누락, 연비/유종 오류 등)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_body:
                  value:
                    error: 차량 정보가 필요합니다.
                invalid_efficiency:
                  value:
                    error: 차량 연비가 올바르지 않습니다.
        "500":
          description: 차량 등록 중 오류 발생
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Vehicle:
      type: object
      description: 등록된 차량 정보
      properties:
        vehicle_id:
          type: integer
          example: 1
        owner:
          type: string
          example: test_user
        vehicle_name:
          type: string
          example: 아반떼
        fuel_efficiency:
          type: number
          format: float
          example: 12.5
        fuel_type:
          type: string
          example: 휘발유

    VehicleCreateRequest:
      type: object
      description: 차량 등록 요청 본문
      properties:
        owner:
          type: string
          description: 차량 소유주 이름
          example: test_user
        vehicle_name:
          type: string
          description: 차량 이름
          example: 아반떼
        fuel_efficiency:
          type: number
          format: float
          description: 차량 연비(km/L)
          example: 12.5
        fuel_type:
          type: string
          description: 차량 유종 (현재는 "휘발유"만 지원)
          example: 휘발유
      required:
        - owner
        - vehicle_name
        - fuel_efficiency
        - fuel_type

    Location:
      type: object
      properties:
        longitude:
          type: number
          format: float
          example: 126.9786567
        latitude:
          type: number
          format: float
          example: 37.566826

    Station:
      type: object
      description: OPINET/Kakao Mobility 조회 및 비용 계산이 반영된 주유소 정보
      properties:
        uni_id:
          type: string
          description: OPINET에서 사용하는 주유소 고유 식별자
          example: A0012345
        os_nm:
          type: string
          description: 주유소 상호
          example: OO주유소
        brand_code:
          type: string
          description: 주유 브랜드 코드
          example: SKE
        product_code:
          type: string
          description: 조회한 유종 코드
          example: B027
        price:
          type: integer
          description: 리터당 판매 가격(원/L)
          example: 1650
        opinet_distance_m:
          type: number
          format: float
          description: OPINET이 계산한 기준 위치와의 거리(m). 실제 비용 계산에는 사용되지 않음.
          example: 850.5
        gis_x_coor:
          type: number
          format: float
          description: 주유소의 원본 KATEC X좌표
        gis_y_coor:
          type: number
          format: float
          description: 주유소의 원본 KATEC Y좌표
        longitude:
          type: number
          format: float
          description: 주유소 경도(WGS84)
          example: 126.9791
        latitude:
          type: number
          format: float
          description: 주유소 위도(WGS84)
          example: 37.5672
        road_distance_m:
          type: number
          format: float
          nullable: true
          description: Kakao Mobility가 계산한 실제 편도 도로거리(m). 길찾기 실패 시 null.
          example: 1200.0
        duration_sec:
          type: integer
          format: int32
          nullable: true
          description: Kakao Mobility가 계산한 예상 소요시간(초). 길찾기 실패 시 null.
          example: 300
        route_available:
          type: boolean
          description: Kakao Mobility 길찾기 성공 여부
          example: true
        one_way_distance_km:
          type: number
          format: float
          nullable: true
          description: 편도 실제 도로거리(km). 비용 계산 불가 시 null.
          example: 1.2
        round_trip_distance_km:
          type: number
          format: float
          nullable: true
          description: 왕복 실제 도로거리(km). 편도거리의 2배. 비용 계산 불가 시 null.
          example: 2.4
        travel_cost:
          type: integer
          nullable: true
          description: 왕복 이동에 소요되는 비용(원). 비용 계산 불가 시 null.
          example: 312
        fuel_cost:
          type: integer
          nullable: true
          description: 실제 주유 비용(원). 비용 계산 불가 시 null.
          example: 49500
        total_cost:
          type: integer
          nullable: true
          description: 이동비 + 주유비를 합산한 실질 총비용(원). 비용 계산 불가 시 null.
          example: 49812
        cost_available:
          type: boolean
          description: 비용 계산 성공 여부 (길찾기 실패 시 false)
          example: true

    StationSearchResult:
      type: object
      properties:
        vehicle:
          $ref: "#/components/schemas/Vehicle"
        fuel_amount:
          type: number
          format: float
          description: 사용자가 입력한 주유량(L)
          example: 30
        location:
          $ref: "#/components/schemas/Location"
        stations:
          type: array
          description: 실질 총비용이 낮은 순으로 정렬된 주유소 목록
          items:
            $ref: "#/components/schemas/Station"
